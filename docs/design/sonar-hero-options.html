<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keystone sonar hero options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@600;800&display=swap">
<style>
:root{--pg-bg:#e4e4e7;--pg-fg:#18181b;--pg-mute:#52525b;--pg-line:#c4c4c8;--pg-panel:#fafafa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg-bg:#09090b;--pg-fg:#f4f4f5;--pg-mute:#a1a1aa;--pg-line:#3f3f46;--pg-panel:#18181b}}
:root[data-theme="dark"]{--pg-bg:#09090b;--pg-fg:#f4f4f5;--pg-mute:#a1a1aa;--pg-line:#3f3f46;--pg-panel:#18181b}
*{box-sizing:border-box}
body{margin:0;background:var(--pg-bg);color:var(--pg-fg);font:14px/1.5 system-ui,sans-serif}
.viewer{max-width:1320px;margin:0 auto;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
.bar h1{font-size:16px;margin:0 8px 0 0}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{font:inherit;font-size:13px;border:1px solid var(--pg-line);background:var(--pg-panel);color:var(--pg-fg);border-radius:6px;padding:4px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pg-fg);color:var(--pg-bg);border-color:var(--pg-fg)}
.idea{color:var(--pg-mute);margin:0 0 10px;max-width:1000px}
.window{border:1px solid var(--pg-line);border-radius:10px;overflow:hidden;box-shadow:0 12px 40px #0004}
.chrome{display:flex;align-items:center;gap:8px;background:var(--pg-panel);padding:8px 12px;border-bottom:1px solid var(--pg-line)}
.chrome i{width:10px;height:10px;border-radius:50%;background:var(--pg-line)}
.chrome .url{flex:1;min-width:0;overflow:hidden;white-space:nowrap;background:var(--pg-bg);border-radius:6px;padding:3px 10px;color:var(--pg-mute);font:12px ui-monospace,monospace}

/* ===== The original Sonar concept, unchanged apart from the hero visual ===== */
.site{--bg:#02060d;--fg:#cfeaf5;--mute:#7fa6b5;--line:#123042;--panel:#06131f;--accent:#34f5c5;--warn:#ffb454;--skel:#0f2a3a;
  background:radial-gradient(ellipse at 50% 60%,#06263a,#02060d 70%);color:var(--fg);font-family:"Space Mono",monospace;overflow:hidden;position:relative}
.site[data-mode=light]{--bg:#e6f4f1;--fg:#062a30;--mute:#3c6a70;--line:#b8d8d4;--panel:#f3fbf9;--accent:#0b8f7a;--warn:#a55b00;--skel:#cfe5e1;
  background:radial-gradient(ellipse at 50% 60%,#ffffff,#d3ebe6 70%)}
.site a{color:inherit}
.site .nav{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:16px 32px;position:relative;z-index:2}
.site .nav .logo{font-family:Syne,sans-serif;font-weight:800;font-size:22px;letter-spacing:.2em;margin-right:auto}
.site .nav a{text-decoration:none;font-size:13px;opacity:.85}
.site .hero{position:relative;min-height:620px}
.site h1.big{position:relative;z-index:2;margin:0;padding:30px 32px 0;font-family:Syne,sans-serif;font-weight:800;font-size:clamp(44px,8vw,112px);line-height:.88;
  text-transform:uppercase;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1px var(--accent);pointer-events:none}
.site h1.big span{color:var(--fg);-webkit-text-stroke:0}
.site canvas{position:absolute;inset:0;width:100%;height:100%}
.site .legend{position:absolute;right:32px;bottom:24px;z-index:2;font-size:12px;list-style:none;margin:0;padding:0;text-align:right}
.site .legend b{color:var(--accent)}
.site .legend li.here{color:var(--accent)}
.site .cap{position:absolute;left:32px;bottom:20px;font-size:12px;color:var(--mute);max-width:520px;z-index:2}
.site section.blk{padding:40px 32px;position:relative}
.site .blk h2{margin:0 0 6px;font-family:Syne,sans-serif;font-weight:800;font-size:34px;text-transform:uppercase}
.site .stamp{font-size:12px;color:var(--mute);margin:0 0 12px}
.site .banner{display:inline-block;border:1px solid var(--warn);padding:8px 12px;margin:0 0 14px}
.site .banner b{color:var(--warn);text-transform:uppercase;letter-spacing:.06em;font-size:12px;margin-right:8px}
.site .tw{overflow-x:auto}
.site table{border-collapse:collapse;width:100%;font-size:13px}
.site th,.site td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.site caption{caption-side:bottom;text-align:left;color:var(--mute);font-size:12px;padding-top:8px}
.site .sk{display:inline-block;height:9px;border-radius:5px;background:var(--skel);vertical-align:middle}
.site .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:0 0 16px}
.site .kpi{border-left:2px solid var(--accent);padding-left:10px}
.site .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.site .kpi .v{font-size:26px;font-weight:800;line-height:1.2;color:var(--accent);text-shadow:0 0 18px color-mix(in srgb,var(--accent) 60%,transparent)}
.site .kpi .s{font-size:12px;color:var(--mute)}
.site .kpi.bad .v{color:var(--warn)}
.site .svc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0;padding:0;list-style:none}
.site .svc li{font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;color:var(--mute)}
.site .svc li.on{border-color:var(--accent);color:var(--fg);font-weight:600}
.site .two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:28px}
.site .note{font-size:12px;color:var(--mute)}
.site footer{padding:22px 32px;font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px 22px;border-top:1px solid var(--line)}
@media (max-width:820px){.site .two{grid-template-columns:1fr}.site .nav,.site section.blk,.site footer,.site h1.big{padding-left:16px;padding-right:16px}.site .cap{left:16px}.site .legend{right:16px}}
</style>
</head>

    // Height field: band b (z rows) carries one gaussian bump per dataset, spread evenly across x.
    const Hf = []; for (let z = 0; z < NZ; z++) { const b = Math.floor(z / rowsPer), [, ds] = BEDZ[b], zr = (z % rowsPer) / (rowsPer - 1), env = Math.sin(Math.PI * zr), row = [];
      for (let x = 0; x < NX; x++) { const u = x / (NX - 1); let h = 0; ds.forEach((d, i) => { const c = (i + .5) / ds.length, s = .5 / ds.length; h = Math.max(h, d[1] / maxF * Math.exp(-(((u - c) / s) ** 2))); }); row.push(h * env); } Hf.push(row); }
    let tilt = .5, tt = .5; const mv = e => { const r = cv.getBoundingClientRect(); tt = (e.clientY - r.top) / r.height; }; cv.addEventListener("pointermove", mv);
    const draw = t => { const W = cv.width, H = cv.height; tilt += (tt - tilt) * .05; ctx.clearRect(0, 0, W, H);
      const scan = REDUCED ? -1 : (t * 6) % (NZ + 10), cam = 1.6 + tilt * 1.2, horizon = H * (.36 + tilt * .06);
      const proj = (x, z, h) => { const zz = 1 + (NZ - 1 - z) / NZ * 0 + z / NZ * cam, sx = W * .5 + (x / (NX - 1) - .5) * W * 1.25 / zz, sy = horizon + (H * .95 - horizon) / zz - h * H * .28 / zz; return [sx, sy]; };
      for (let z = NZ - 1; z >= 0; z--) { const d = Math.abs(z - scan), lit = scan < 0 ? .5 : Math.max(0, 1 - d / 4), far = z / NZ;
        ctx.beginPath(); for (let x = 0; x < NX; x++) { const [sx, sy] = proj(x, z, Hf[z][x]); x ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); }
        ctx.strokeStyle = lit > .05 ? acc : mute; ctx.globalAlpha = lit > .05 ? .35 + lit * .65 : .12 + (1 - far) * .25; ctx.lineWidth = (lit > .05 ? 1.6 : 1) * dpr; ctx.stroke(); }
      ctx.globalAlpha = .1; ctx.strokeStyle = mute; for (let x = 0; x < NX; x += 6) { ctx.beginPath(); for (let z = 0; z < NZ; z++) { const [sx, sy] = proj(x, z, Hf[z][x]); z ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); } ctx.stroke(); }
      ctx.globalAlpha = 1; const band = scan < 0 ? null : BEDZ[Math.min(BEDZ.length - 1, Math.floor(scan / rowsPer))]?.[0]; lis.forEach(l => l.classList.toggle("here", l.dataset.k === band)); };
    if (REDUCED) { draw(0); return () => { off(); cv.removeEventListener("pointermove", mv); }; }
    const stop = loop(cv, draw); return () => { stop(); off(); cv.removeEventListener("pointermove", mv); }; } },

{ name: "Echo ribbon", idea: "The run log as a sound ribbon spiralling down into the deep: a 3D helix with one twist segment per real pipeline run, oldest at the surface. Ribbon width is the run's wall time (log scale); failed runs turn amber. A pulse travels down the ribbon one run per half second, replaying the log, and the legend reads out the run it is passing. The pointer turns the helix.",
  html: () => page(`<canvas id="cv" role="img" aria-label="Helix of ${D.runs.length} pipeline runs"></canvas>`,
    `<li>runs <b>${D.runs.length}</b></li><li>failed <b>${D.runs.filter(r => r.status === "failed").length}</b></li><li id="now" style="margin-top:6px;color:var(--mute)">&nbsp;</li>`,
    `Ribbon = pipeline_metrics.json run history: one segment per run, width = wall time (log scale, 0.01 s to 45 min), amber = failed. Radar contacts: ${fmt(D.radar.row_count)} (${esc(D.radar.status.state)}).`),
  mount(root) { const cv = root.querySelector("#cv"), { ctx, dpr, off } = canvas(cv), acc = css(root, "--accent"), warn = css(root, "--warn"), mute = css(root, "--mute"), now = root.querySelector("#now");
    const runs = D.runs, N = runs.length, wmax = Math.log10(1 + 2700), seg = 10;
    let yaw = 0, ty = 0; const mv = e => { const r = cv.getBoundingClientRect(); ty = ((e.clientX - r.left) / r.width - .5) * 4; }; cv.addEventListener("pointermove", mv);
    const draw = t => { const W = cv.width, H = cv.height; yaw += (ty - yaw) * .05; ctx.clearRect(0, 0, W, H);
      const cx = W * .66, top = H * .1, bot = H * .92, R = Math.min(W * .16, 220 * dpr), pulse = REDUCED ? -1 : (t * 2) % (N + 4), pts = [];
      for (let i = 0; i < N * seg; i++) { const s = i / (N * seg - 1), a = s * Math.PI * 7 + yaw, r = runs[Math.floor(i / seg)], w = (2 + 26 * Math.log10(1 + r.wall_seconds) / wmax) * dpr;
        const depth = Math.sin(a), rr = R * (1 - s * .35); pts.push({ x: cx + Math.cos(a) * rr, y: top + s * (bot - top) + depth * rr * .18, z: depth, w, r, k: Math.floor(i / seg) }); }
      const order = pts.map((p, i) => i).sort((a, b) => pts[a].z - pts[b].z);
      order.forEach(i => { if (i === 0) return; const p = pts[i], q = pts[i - 1], lit = pulse < 0 ? .6 : Math.max(0, 1 - Math.abs(p.k - pulse) / 1.5);
        ctx.strokeStyle = p.r.status === "failed" ? warn : (lit > .05 ? acc : mute); ctx.globalAlpha = (.25 + (p.z + 1) * .3) * (lit > .05 ? 1 : .6) + lit * .3;
        ctx.lineWidth = p.w * (.6 + (p.z + 1) * .25); ctx.lineCap = "butt"; ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(p.x, p.y); ctx.stroke(); });
      ctx.globalAlpha = 1; if (pulse >= 0 && pulse < N) { const r = runs[Math.floor(pulse)]; now.textContent = `run ${Math.floor(pulse) + 1}: ${utc(r.started_at)} · ${r.wall_seconds} s · ${r.status}`; } };
    if (REDUCED) { draw(0); return () => { off(); cv.removeEventListener("pointermove", mv); }; }
    const stop = loop(cv, draw); return () => { stop(); off(); cv.removeEventListener("pointermove", mv); }; } }
];

let cur = 0, light = false, cleanup = () => {};
const site = document.getElementById("site");
function draw() { cleanup(); const o = OPTS[cur]; site.className = "site"; site.dataset.mode = light ? "light" : "dark";
  site.innerHTML = o.html(); cleanup = o.mount(site) || (() => {});
  document.getElementById("idea").textContent = `${cur + 1}. ${o.name}: ${o.idea}`;
  document.querySelectorAll("#pick button").forEach((b, i) => b.setAttribute("aria-pressed", i === cur)); document.getElementById("mode").setAttribute("aria-pressed", light); }
document.getElementById("pick").innerHTML = OPTS.map((o, i) => `<button type="button">${i + 1}. ${o.name}</button>`).join("");
document.getElementById("pick").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { cur = [...b.parentNode.children].indexOf(b); draw(); } });
document.getElementById("mode").addEventListener("click", () => { light = !light; draw(); });
draw();
</script>
</body>
