name: ci

# Quality gates on every push and pull request: lint, types, unit tests, a build from the committed
# fixture snapshot of real exports, then the trace and accessibility checks on the built site.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Schemas match keystone-pipeline
        run: npm run schemas:check
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm test
      - name: Exports (fixture snapshot, strict)
        run: node scripts/fetch-data.mjs --from fixtures/site-data --strict
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Trace and accessibility (light and dark)
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
