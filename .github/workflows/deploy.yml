name: deploy

# Build from the pipeline's live exports (release site-data) and publish to GitHub Pages.
# The same trace and accessibility gates run on the live data before anything is published.
# Deploying needs Pages enabled with source "GitHub Actions" and the repository variable
# PAGES_ENABLED=true (owner's decision); until then the build and gates still run.
on:
  push:
    branches: [main]
  schedule:
    - cron: "40 6 * * *" # after the pipeline's daily publish
  workflow_dispatch:
  repository_dispatch:
    types: [site-data]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTONE_BASE_PATH: /keystone-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Exports from release site-data
        run: npm run data
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Trace and accessibility on the live exports
        run: npm run test:e2e
      - if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
